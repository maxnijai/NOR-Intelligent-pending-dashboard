            <KPI label="NOR1" value={D.reg_sum.NOR1.total} sub={`Avg ${D.reg_sum.NOR1.avg_aging}d`} color={C.b}/>
            <KPI label="NOR2" value={D.reg_sum.NOR2.total} sub={`Avg ${D.reg_sum.NOR2.avg_aging}d`} color={C.cy}/>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14,marginBottom:16}}>
            <Card title="Classification — Problem & Vendor" dot={C.or}>
              {Object.entries(D.prob).map(([p,c],i)=>(<div key={p} style={{marginBottom:8}}><div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}><span>{p}</span><span style={{fontFamily:"monospace",color:C.mu}}>{c}</span></div><Bar val={c} max={D.total} color={[C.or,C.rd,C.pu,C.b][i]}/></div>))}
              <div style={{marginTop:10,paddingTop:8,borderTop:`1px solid ${C.bd}`,fontSize:10,color:C.mu}}>Vendor: <strong style={{color:C.b}}>Er {D.ven.Ericsson}</strong> | <strong style={{color:C.or}}>Nk {D.ven.Nokia}</strong> | <strong style={{color:C.gn}}>Hw {D.ven.Huawei}</strong></div>
            </Card>
            <Card title="Aging Flag — ทั้งหมด" dot={C.gn}>
              <SB items={afI.map(a=>({...a,v:D.af[a.k]||0}))} total={D.total} h={32}/>
              <div style={{display:"flex",gap:8,marginTop:8,fontSize:9,color:C.mu,flexWrap:"wrap"}}>
                {afI.map((a,i)=>{const v=D.af[a.k]||0;return v>0&&<span key={i} style={{display:"flex",alignItems:"center",gap:3}}><span style={{width:8,height:8,borderRadius:2,background:a.c}}/>{a.l}: {v}</span>;})}
              </div>
              <div style={{marginTop:16,paddingTop:14,borderTop:`1px solid ${C.bd}`}}>
                <div style={{fontSize:10,fontWeight:700,color:C.mu,textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>Aging Flag per Region</div>
                {["NOR1","NOR2"].map(reg=>{
                  const rs=D.reg_sum[reg]; const rc=reg==="NOR1"?C.b:C.cy;
                  const overCount=rs.a1+rs.a3; const overPct=(overCount/rs.total*100).toFixed(0);
                  return(
                    <div key={reg} style={{marginBottom:14,padding:"12px",background:C.s2,borderRadius:8,border:`1px solid ${C.bd}`}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <span style={{fontFamily:"monospace",fontSize:13,fontWeight:700,color:rc,padding:"2px 10px",background:`${rc}15`,borderRadius:4,border:`1px solid ${rc}30`}}>{reg}</span>
                          <span style={{fontFamily:"monospace",fontSize:16,fontWeight:700,color:C.tx}}>{rs.total}</span>
                          <span style={{fontSize:10,color:C.mu}}>tickets</span>
                        </div>
                        <div style={{display:"flex",alignItems:"center",gap:6}}>
                          <span style={{fontSize:10,color:overCount>20?C.rd:C.or,fontWeight:600}}>Over SLA: {overCount} ({overPct}%)</span>
                        </div>
                      </div>
                      <SB items={[{v:rs.aw,c:C.gnd},{v:rs.a1,c:C.gnl,tc:"#1a1a1a"},{v:rs.a3,c:C.yl,tc:"#1a1a1a"}]} total={rs.total} h={28}/>
                      <div style={{display:"flex",justifyContent:"space-between",marginTop:8}}>
                        {[[rs.aw,"Within SLA",C.gnd],[rs.a1,"Over <1d",C.gnl],[rs.a3,"Over <3d",C.yl]].map(([v,l,c],i)=>(
                          <div key={i} style={{textAlign:"center",flex:1}}>
                            <div style={{fontFamily:"monospace",fontSize:16,fontWeight:700,color:c}}>{v}</div>
                            <div style={{fontSize:8,color:C.mu}}>{l} ({v>0?(v/rs.total*100).toFixed(0):0}%)</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </Card>
            <Card title="Root Cause × Aging Flag" dot={C.rd}>
              {D.root_af.map((r,i)=>(<div key={i} style={{marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}><span style={{fontWeight:600}}>{r.name}</span><span style={{fontFamily:"monospace",color:C.mu}}>{r.total} ({(r.total/D.total*100).toFixed(1)}%)</span></div>
                <SB items={[{v:r.aw,c:C.gnd},{v:r.a1,c:C.gnl,tc:"#1a1a1a"},{v:r.a3,c:C.yl,tc:"#1a1a1a"},{v:r.a7,c:C.rlo}]} total={r.total} h={20}/>
                <div style={{display:"flex",gap:6,marginTop:3,fontSize:9,color:C.mu}}>
                  {r.aw>0&&<span style={{color:C.gnd}}>SLA:{r.aw}</span>}{r.a1>0&&<span style={{color:C.gnl}}>&lt;1d:{r.a1}</span>}{r.a3>0&&<span style={{color:C.yl}}>&lt;3d:{r.a3}</span>}
                  <span style={{marginLeft:"auto",color:r.a1+r.a3+r.a7>0?C.or:C.gn}}>Over:{((r.a1+r.a3+r.a7)/r.total*100).toFixed(0)}%</span>
                </div>
              </div>))}
              <div style={{marginTop:8,paddingTop:8,borderTop:`1px solid ${C.bd}`}}>{afLeg()}</div>
            </Card>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:16}}>
            {["NOR1","NOR2"].map(reg=>{const rc=reg==="NOR1"?C.b:C.cy;const rs=D.reg_sum[reg];const rOwn=D.owners.filter(o=>o.reg===reg);const maxC=Math.max(...rOwn.map(o=>o.count));return(
              <Card key={reg} title={`${reg} — สรุปราย Owner Group (${rOwn.length} ทีม)`} dot={rc}>
                <div style={{display:"flex",gap:14,marginBottom:14,padding:"10px 14px",background:C.s2,borderRadius:8}}>
                  <div style={{textAlign:"center",flex:1}}><div style={{fontFamily:"monospace",fontSize:22,fontWeight:700,color:rc}}>{rs.total}</div><div style={{fontSize:9,color:C.mu}}>Tickets</div></div>
                  <div style={{textAlign:"center",flex:1}}><div style={{fontFamily:"monospace",fontSize:22,fontWeight:700,color:C.gnd}}>{rs.aw}</div><div style={{fontSize:9,color:C.mu}}>Within SLA</div></div>
                  <div style={{textAlign:"center",flex:1}}><div style={{fontFamily:"monospace",fontSize:22,fontWeight:700,color:(rs.a1+rs.a3)>20?C.rd:C.or}}>{rs.a1+rs.a3}</div><div style={{fontSize:9,color:C.mu}}>Over SLA</div></div>
                  <div style={{textAlign:"center",flex:1}}><div style={{fontFamily:"monospace",fontSize:22,fontWeight:700,color:rs.avg_aging>0.5?C.or:C.gn}}>{rs.avg_aging}d</div><div style={{fontSize:9,color:C.mu}}>Avg Aging</div></div>
                </div>
                {rOwn.map((o,i)=>(<OwnerCard key={i} o={o} maxCount={maxC} rc={rc}/>))}
                <div style={{marginTop:10,paddingTop:8,borderTop:`1px solid ${C.bd}`}}>{afLeg()}</div>
              </Card>);})}
          </div>

          <div style={{padding:"14px 18px",background:C.s1,border:`1px solid ${C.bd}`,borderLeft:`3px solid ${C.or}`,borderRadius:12}}>
            <div style={{fontSize:13,fontWeight:700,color:C.or,marginBottom:8}}>💡 Insight Summary</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:20,fontSize:12,lineHeight:1.7}}>
              <div><div style={{fontWeight:700,color:C.rd,marginBottom:3}}>⚠️ NOR1 ช้ากว่า ~2x</div><div style={{color:C.mu}}>NOR1 Avg 0.55d, Over SLA 53 (33%) vs NOR2 0.28d, Over 8 (11%)</div></div>
              <div><div style={{fontWeight:700,color:C.or,marginBottom:3}}>🔍 Root Cause น่าจับตา</div><div style={{color:C.mu}}>IPRAN DOWN Over SLA 67% | RECTIFIER FAIL 100% Over | Power Fail 22% Over</div></div>
              <div><div style={{fontWeight:700,color:C.gn,marginBottom:3}}>✅ Best Teams</div><div style={{color:C.mu}}>KPP-NOP 0.08d, TAK-NOP 0.22d, LPG-NOP 0.28d เร็วที่สุด</div></div>
            </div>
          </div>
        </>}

        {tab==="nor1"&&<><div style={{fontSize:18,fontWeight:700,color:C.b,marginBottom:14}}>🔵 NOR1 — รายละเอียด ({D.reg_sum.NOR1.total} tickets, {D.owners.filter(o=>o.reg==="NOR1").length} Owner Groups)</div><RegionBlock reg="NOR1"/></>}
        {tab==="nor2"&&<><div style={{fontSize:18,fontWeight:700,color:C.cy,marginBottom:14}}>🟦 NOR2 — รายละเอียด ({D.reg_sum.NOR2.total} tickets, {D.owners.filter(o=>o.reg==="NOR2").length} Owner Groups)</div><RegionBlock reg="NOR2"/></>}
      </div>
    </div>
  );
}
